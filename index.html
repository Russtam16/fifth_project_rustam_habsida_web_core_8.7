<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ремонт техники различных брендов</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="brands">
    <h2 class="brands__title">Ремонт техники различных брендов</h2>

    <div class="swiper brands__slider">
      <ul class="swiper-wrapper brands__list">
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/lenovo.svg" alt="Lenovo">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/samsung.svg" alt="SAMSUNG">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/apple.svg" alt="Apple">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/bosch.svg" alt="Bosch">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/hp.svg" alt="HP">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/acer.svg" alt="Acer">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/sony.svg" alt="Sony">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/viewsonic.svg" alt="ViewSonic">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/acer.svg" alt="Acer">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/sony.svg" alt="Sony">
            <span class="brands__arrow">›</span>
          </a>
        </li>
        <li class="swiper-slide brands__item">
          <a class="brands__link" href="#">
            <img class="brands__logo" src="logo/viewsonic.svg" alt="ViewSonic">
            <span class="brands__arrow">›</span>
          </a>
        </li>
      </ul>
      <div class="swiper-pagination brands__pagination"></div>
    </div>

    <button class="brands__toggle" type="button" aria-expanded="false">
      <img class="brands__toggle-icon" src="logo/expanddown.svg" alt="">
      <span class="brands__toggle-text">Показать все</span>
    </button>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
